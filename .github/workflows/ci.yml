name: CI

# Lint and test every package on Linux and Windows, for pull requests and main, and on macOS for
# main and the pull requests that need it.
#
# sc2-adjutant runs the published @team-antioch/sc2-asset-catalog, sc2-finder-kit, sc2-doodad-finder
# and sc2-set-finder at the versions pinned in packages/core, packages/doodad-finder and
# packages/set-finder (ADR-0022, #802). CI installs those pinned packages and refuses a linked
# checkout, so a pull request that bumps the pin is tested before it is adopted.
#
# Tests that need the game, the Editor or a tool the runner lacks (ImageMagick) skip themselves,
# as they do on any machine without it.
#
# Linux and Windows each run three jobs at once (#5), which together run what `npm test` and
# `npm run lint` run: core's tests in two shards, and a third job with lint, every other package's
# tests and the check scripts.
#
# macOS runs the tests in one job, without lint, which is the same on every system: hosted macOS
# runners are scarce, and three jobs at once were slow to start and sometimes cancelled. One job
# takes three times as long as Linux's slowest, so a pull request runs it only when it changes the
# macOS Host, a package's dependencies or CI itself. Every push to main runs it, and so does a run
# started by hand (`gh workflow run CI --ref <branch>`), for a pull request macOS should check.
# A pull request that skips it passes its required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.part }})
    # Actions minutes are free only for a public repo: while this one is private, every run is skipped.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        part: [core-1, core-2, rest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Defender scans every file the install and the tests write, and the temp folder the tests
      # use is on C:, slower than the D: drive the checkout is on.
      - name: Speed up the Windows file system
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          vitest-cache-key: vitest-${{ runner.os }}-${{ matrix.part }}
      # A hang fails here, not at the job's limit.
      - name: Test core (${{ matrix.part }})
        if: startsWith(matrix.part, 'core-')
        run: npm test -w packages/core -- --shard=${{ matrix.part == 'core-1' && '1' || '2' }}/2
        timeout-minutes: 30
      - run: npm run lint
        if: matrix.part == 'rest'
        timeout-minutes: 10
      - name: Test every package but core, then run the checks
        if: matrix.part == 'rest'
        shell: bash
        timeout-minutes: 30
        run: bash scripts/test-except-core.sh
      # Only this part runs every build and lint, so only it saves Turborepo's cache (the setup
      # action restores it), pruned to the entries it used.
      - name: Prune Turborepo's cache to what this job used
        if: always() && matrix.part == 'rest'
        run: node scripts/prune-turbo-cache.mjs
      - name: Save Turborepo's cache
        if: always() && matrix.part == 'rest'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save vitest's results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/node_modules/.vite/vitest
            site/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Whether this run tests on macOS: every run but a pull request's, and a pull request that changes
  # the macOS Host, a package.json, the lockfile or anything under .github.
  macos-needed:
    name: Does macOS need to run?
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename')
          if grep -qE '^(packages/plugin-host-macos/|\.github/|package-lock\.json$|(.+/)?package\.json$)' <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change macOS needs to check; skipping it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test-macos:
    # The name the required check knows.
    name: macos-latest (all)
    needs: macos-needed
    # always(), so a failure to decide runs macOS rather than skipping it, and a skip passes.
    if: ${{ always() && !github.event.repository.private && needs.macos-needed.outputs.run != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          vitest-cache-key: vitest-${{ runner.os }}-all
      # The runner has three cores, and vitest's default of one fewer leaves one idle while the
      # tests wait on ffmpeg and the file system.
      - name: Test core
        run: npm test -w packages/core -- --maxWorkers=3
        timeout-minutes: 30
      - name: Test every package but core, then run the checks
        timeout-minutes: 15
        run: bash scripts/test-except-core.sh
      - name: Prune Turborepo's cache to what this job used
        if: always()
        run: node scripts/prune-turbo-cache.mjs
      - name: Save Turborepo's cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save vitest's results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/node_modules/.vite/vitest
            site/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-all-${{ github.run_id }}-${{ github.run_attempt }}
