name: CI

# Lint and test every package on Linux, macOS and Windows, for pull requests and main.
#
# sc2-adjutant runs the published @team-antioch/sc2-asset-catalog, sc2-finder-kit, sc2-doodad-finder
# and sc2-set-finder at the versions pinned in packages/core, packages/doodad-finder and
# packages/set-finder (ADR-0022, #802). CI installs those pinned packages and refuses a linked
# checkout, so a pull request that bumps the pin is tested before it is adopted.
#
# Tests that need the game, the Editor or a tool the runner lacks (ImageMagick) skip themselves,
# as they do on any machine without it.
#
# Linux and Windows each run three jobs at once (#5), which together run what `npm test` and
# `npm run lint` run: core's tests in two shards, and a third job with lint, every other package's
# tests and the check scripts. macOS runs them all in one job: hosted macOS runners are scarce, and
# three jobs at once were slow to start and sometimes cancelled.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.part }})
    # Actions minutes are free only for a public repo: while this one is private, every run is skipped.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        part: [core-1, core-2, rest]
        include:
          - os: macos-latest
            part: all
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Defender scans every file the install and the tests write, and the temp folder the tests
      # use is on C:, slower than the D: drive the checkout is on.
      - name: Speed up the Windows file system
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # A compile turns placeholder voices into Ogg Vorbis with ffmpeg, as on an author's machine.
      - name: Install ffmpeg
        shell: bash
        timeout-minutes: 15
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -hide_banner -encoders | grep -i vorbis
      - run: npm ci
      - name: Check nothing moved is back, and the pinned, published packages are what's installed
        run: node scripts/check-catalog-moved.mjs --installed
      # Vitest's record of each test file's last duration, so it starts the longest first. Restored
      # after npm ci, which deletes node_modules.
      - name: Restore vitest's results
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/*/node_modules/.vite/vitest
            site/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: vitest-${{ runner.os }}-${{ matrix.part }}-
      # A hang fails here, not at the job's limit.
      - name: Test core (${{ matrix.part }})
        if: startsWith(matrix.part, 'core-')
        run: npm test -w packages/core -- --shard=${{ matrix.part == 'core-1' && '1' || '2' }}/2
        timeout-minutes: 30
      - run: npm run lint
        if: matrix.part == 'rest' || matrix.part == 'all'
        timeout-minutes: 10
      - name: Test every package but core, then run the checks
        if: matrix.part == 'rest'
        shell: bash
        timeout-minutes: 30
        run: |
          workspaces=()
          for folder in packages/*/ site/; do
            [ "$folder" = packages/core/ ] || workspaces+=(-w "${folder%/}")
          done
          npm test "${workspaces[@]}" --if-present
          npm run test:checks
      - run: npm test
        if: matrix.part == 'all'
        timeout-minutes: 30
      - name: Save vitest's results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            packages/*/node_modules/.vite/vitest
            site/node_modules/.vite/vitest
          key: vitest-${{ runner.os }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
