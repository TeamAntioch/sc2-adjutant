name: CI

# Lint and test every package on Linux, macOS and Windows, for pull requests and main.
#
# sc2-adjutant runs the published @team-antioch/sc2-asset-catalog, sc2-finder-kit, sc2-doodad-finder
# and sc2-set-finder at the versions pinned in packages/core, packages/doodad-finder and
# packages/set-finder (ADR-0022, #802). CI installs those pinned packages and refuses a linked
# checkout, so a pull request that bumps the pin is tested before it is adopted.
#
# Tests that need the game, the Editor or a tool the runner lacks (ImageMagick) skip themselves,
# as they do on any machine without it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    # Actions minutes are free only for a public repo: while this one is private, every run is skipped.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # A compile turns placeholder voices into Ogg Vorbis with ffmpeg, as on an author's machine.
      - name: Install ffmpeg
        shell: bash
        timeout-minutes: 15
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS) brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -hide_banner -encoders | grep -i vorbis
      - run: npm ci
      - name: Check nothing moved is back, and the pinned, published packages are what's installed
        run: node scripts/check-catalog-moved.mjs --installed
      # Lint takes about 2 minutes and the tests up to 20 (Windows is the slowest): a hang fails here, not at the job's limit.
      - run: npm run lint
        timeout-minutes: 10
      - run: npm test
        timeout-minutes: 30
